name: Probe Realtor.com access

# Runs in about a minute and reports which transport (if any) gets past
# Realtor.com's bot defenses. Use this instead of a full scrape when
# diagnosing a 403 — the scrape takes 40 minutes to tell you the same thing.

on:
  workflow_dispatch:
    inputs:
      chrome_major:
        description: "Chrome major version to claim in the User-Agent (blank = default)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Probe
        working-directory: scraper
        env:
          SCRAPER_CHROME_MAJOR: ${{ inputs.chrome_major }}
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
        run: python probe.py
